<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EsToDoList</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen overflow-x-hidden">
    <header class="bg-indigo-600 text-white">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-xl md:text-3xl font-bold">EsToDoList</h1>
            <span class="hidden text-sm md:inline">Organize sua rotina escolar</span>
        </div>
    </header>
    <main class="max-w-5xl mx-auto px-4 py-6 grid grid-cols-1 gap-6 lg:grid-cols-3">



        <!-- Coluna 2: lista de tarefas -->
        <section class="lg:col-span-2 min-w-0">
        <!-- ADICIONA: space-y-3 (espaço entre as tarefas) -->
        <ul class="space-y-3">
            <!-- ADICIONA nos 3 <li> (repita nos 3): bg-white rounded-xl shadow p-4 flex flex-col gap-3 -->
            <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3">
            <!-- ADICIONA nos 3 <label>: flex items-start gap-3 -->
            <label class="flex items-start gap-3">
                <!-- ADICIONA nos 3 checkboxes: mt-1 w-5 h-5 -->
                <input type="checkbox" class="mt-1 w-5 h-5">
                <span>
                <!-- ADICIONA: block font-medium no título da tarefa e text-sm text-slate-500 na data (repita nos 3 itens) -->
                <span class="block font-medium">Trabalho de História</span>
                <span class="text-sm text-slate-500">20/10/2026</span>
                </span>
            </label>
            <!-- ADICIONA nas 3 <div> dos botões: flex gap-2 -->
            <div class="flex gap-2">
                <!-- ADICIONA nos 6 botões: flex-1 px-4 py-3 rounded-lg. Editar: bg-amber-100. Excluir: bg-red-100 text-red-700 -->
                <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
                <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
            </div>
            </li>

            <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3">
            <label class="flex items-start gap-3">
                <input type="checkbox" class="mt-1 w-5 h-5">
                <span>
                <span class="block font-medium">Estudar para a prova de Matemática</span>
                <span class="text-sm text-slate-500">22/10/2026</span>
                </span>
            </label>
            <div class="flex gap-2">
                <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
                <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
            </div>
            </li>

            <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3">
            <label class="flex items-start gap-3">
                <input type="checkbox" class="mt-1 w-5 h-5">
                <span>
                <span class="block font-medium">Estudar para a prova de Física</span>
                <span class="text-sm text-slate-500">23/10/2026</span>
                </span>
            </label>
            <div class="flex gap-2">
                <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
                <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
            </div>
            </li>

            <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3">
            <label class="flex items-start gap-3">
                <input type="checkbox" class="mt-1 w-5 h-5">
                <span>
                <span class="block font-medium">Fazer slide de GEO</span>
                <span class="text-sm text-slate-500">24/10/2026</span>
                </span>
            </label>
            <div class="flex gap-2">
                <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
                <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
            </div>
            </li>

            <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3">
            <label class="flex items-start gap-3">
                <input type="checkbox" class="mt-1 w-5 h-5">
                <span>
                <span class="block font-medium">Estudar para a prova de Biologia</span>
                <span class="text-sm text-slate-500">27/10/2026</span>
                </span>
            </label>
            <div class="flex gap-2">
                <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
                <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
            </div>
            </li>

            <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3">
            <label class="flex items-start gap-3">
                <input type="checkbox" class="mt-1 w-5 h-5">
                <span>
                <span class="block font-medium">Estudar para a prova de Geografia</span>
                <span class="text-sm text-slate-500">29/10/2026</span>
                </span>
            </label>
            <div class="flex gap-2">
                <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
                <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
            </div>
            </li>

            <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3">
            <label class="flex items-start gap-3">
                <input type="checkbox" class="mt-1 w-5 h-5">
                <span>
                <span class="block font-medium">Estudar para a prova de Química</span>
                <span class="text-sm text-slate-500">30/10/2026</span>
                </span>
            </label>
            <div class="flex gap-2">
                <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
                <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
            </div>
            </li>

            <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3">
            <label class="flex items-start gap-3">
                <input type="checkbox" checked class="mt-1 w-5 h-5">
                <span>
                <span class="block font-medium line-through text-slate-400">Entregar projeto no GitHub</span>
                <span class="text-sm text-slate-500">08/10/2026</span>
                </span>
            </label>
            <div class="flex gap-2">
                <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
                <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
            </div>
            </li>
        </ul>

        <!-- ADICIONA: mt-4 text-sm text-slate-500 -->
        <p class="mt-4 text-sm text-slate-500">2 tarefas pendentes</p>
        </section>

            
        <!-- Coluna 1: criar, pesquisar e filtrar -->
        <section class="order-first lg:order-last bg-white rounded-xl shadow p-4 space-y-4 lg:sticky lg:top-6 lg:self-start">
            <form class="flex flex-col md:flex-row gap-3 lg:flex-col">
                <input type="text" placeholder="Nova Tarefa" class="border rounded-lg px-3 py-3 md:flex-3 focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <input type="date" class="border rounded-lg px-3 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <button type="submit" class="bg-indigo-500 text-white rounded-lg px-4 py-3 font-semibold hover:bg-indigo-700 tranition duration-600">Adicionar</button>
            </form>
            <input type="search" placeholder="Pesquisar tarefa..." class="w-full border rounded-lg px-3 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-400">
            <div class="flex gap-2 overflow-x-auto lg:flex-wrap">
                <button class="px-4 py-3 rounded-full bg-indigo-600 text-white whitespace-nowrap">Todas</button>
                <button class="px-4 py-3 rounded-full bg-slate-200 whitespace-nowrap">Pendentes</button>
                <button class="px-4 py-3 rounded-full bg-slate-200 whitespace-nowrap">Concluídas</button>
            </div>
        </section>
        
    </main>

    </body>
    </html>
